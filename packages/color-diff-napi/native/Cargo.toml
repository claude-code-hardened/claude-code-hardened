[package]
name = "color-diff-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
syntect = { version = "5", default-features = false, features = [
  "default-fancy",
  "plist-load",
] }
unicode-width = "0.2"
memchr = "2"
similar = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
