[package]
name = "search-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

# ripgrep 核心库栈（基于原版 rg 的进程内改造基座）
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
ignore = "0.4"

# 已有 crate 验证过可交叉编译的辅助
memchr = "2"
rustc-hash = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
