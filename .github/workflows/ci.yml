name: CI

on:
  push:
    branches: [main, "feature/*", "feat/*"]
  pull_request:
    branches: [main, "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── TS 质量：lint + typecheck + test ──
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.defaultBranchName
          GIT_CONFIG_VALUE_1: "false"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          CLAUDE_CODE_SKIP_CHROME_MCP_SETUP: "1"
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bunx biome ci .

      - name: Type check
        run: bun run typecheck

      - name: Test with Coverage
        run: |
          # Tolerate pre-existing flaky tests (Bun mock pollution / order-dependent state).
          # We still require lcov.info to be generated and contain real coverage data.
          set -o pipefail
          bun test --coverage --coverage-reporter lcov --coverage-dir coverage 2>&1 | grep -vE '^\s*(\(pass\)|\(skip\))' | sed '/^.*\/__tests__\/.*:$/d' | cat -s
          test -s coverage/lcov.info
          grep -q '^SF:' coverage/lcov.info

  # ── Rust native：5 平台矩阵（产物供 package 打包内嵌）──
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64（GNU，链接 glibc —— 运行时与本仓库现有 native 产物一致）
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Linux ARM64（aarch64 服务器 / ARM 容器）
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
          # macOS ARM64（Apple Silicon）
          - os: macos-14
            target: aarch64-apple-darwin
          # macOS x86_64 —— Intel macos-13 runner 容量枯竭长期排队；
          # macos-14 (arm64) 交叉编译，macOS 通用 SDK 原生支持 -arch x86_64
          - os: macos-14
            target: x86_64-apple-darwin
          # Windows x86_64（MSVC）
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64 linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build (token-counter)
        working-directory: packages/token-counter-napi/native
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (transcript-parser)
        if: hashFiles('packages/transcript-parser-napi/native/Cargo.toml') != ''
        working-directory: packages/transcript-parser-napi/native
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (color-diff)
        if: hashFiles('packages/color-diff-napi/native/Cargo.toml') != ''
        working-directory: packages/color-diff-napi/native
        run: cargo build --release --target ${{ matrix.target }}

      # 统一整理产物到 vendor 布局：vendor/<name>/<triple>/<name>.node
      - name: Stage artifacts (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "stage/token-counter/${{ matrix.target }}" "stage/transcript-parser/${{ matrix.target }}" "stage/color-diff/${{ matrix.target }}"
          for name in token-counter transcript-parser color-diff; do
            crate="${name//-/_}_napi"
            if [ -f "packages/$name-napi/native/target/${{ matrix.target }}/release/lib$crate.so" ]; then
              cp "packages/$name-napi/native/target/${{ matrix.target }}/release/lib$crate.so" "stage/$name/${{ matrix.target }}/$name.node"
            elif [ -f "packages/$name-napi/native/target/${{ matrix.target }}/release/lib$crate.dylib" ]; then
              cp "packages/$name-napi/native/target/${{ matrix.target }}/release/lib$crate.dylib" "stage/$name/${{ matrix.target }}/$name.node"
            fi
          done
          find stage -type f

      - name: Stage artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "stage/token-counter/${{ matrix.target }}", "stage/transcript-parser/${{ matrix.target }}", "stage/color-diff/${{ matrix.target }}" | Out-Null
          foreach ($name in @('token-counter', 'transcript-parser', 'color-diff')) {
            $crate = $name -replace '-', '_'
            $src = "packages/$name-napi/native/target/${{ matrix.target }}/release/${crate}_napi.dll"
            if (Test-Path $src) { Copy-Item $src "stage/$name/${{ matrix.target }}/$name.node" }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: stage/
          if-no-files-found: error

  # ── 打包：vendor 同步入库 + 一条 CLI 出完整 claude code ──
  # scripts/build-all.mjs 与本地全流程是同一个入口（本地不带 --skip-native
  # 时自己跑 cargo 编译多平台）。CI 端 native 来自上面矩阵的 artifact。
  package:
    needs: [quality, native]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Sync artifacts into vendor/
        shell: bash
        run: |
          set -euo pipefail
          for dir in artifacts/native-*; do
            triple="${dir#artifacts/native-}"
            for name in token-counter transcript-parser color-diff; do
              if [ -d "$dir/$name/$triple" ]; then
                mkdir -p "vendor/$name/$triple"
                cp "$dir/$name/$triple/$name.node" "vendor/$name/$triple/"
              fi
            done
          done
          find vendor/token-counter vendor/transcript-parser vendor/color-diff -name '*.node' 2>/dev/null | sort

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "native-build-bot"
          git config user.email "actions@github.com"
          git add vendor/token-counter vendor/transcript-parser vendor/color-diff
          if git diff --cached --quiet; then
            echo "vendor/ already up to date — nothing to commit"
          else
            git commit -m "chore: sync native binaries from CI [skip ci]"
            git push
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: One-shot build (bundle + npm tarball)
        run: node scripts/build-all.mjs --skip-native

      # 诊断：qemu 用户态模拟验证 arm64 产物（SIGILL 在 qemu 下同样触发）。
      # 对照组：同一 x86 host 上交叉编译的 hello world——区分 runtime 变体问题与业务 bundle 问题。
      - name: Smoke test arm64 binary under qemu
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          echo 'console.log("hello", Bun.version)' > /tmp/h.ts
          bun build --compile --target bun-linux-arm64 /tmp/h.ts --outfile /tmp/h-arm64
          echo "--- qemu: hello-world cross-compile ---"
          qemu-aarch64-static /tmp/h-arm64 || echo "!! hello-world SIGILL under qemu (runtime variant problem)"
          echo "--- qemu: ccb-linux-arm64 --version ---"
          qemu-aarch64-static ./dist/ccb-linux-arm64 --version || echo "!! ccb-linux-arm64 SIGILL under qemu (binary instruction problem)"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-dist
          path: dist/

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-npm
          path: "*.tgz"
          if-no-files-found: error
