name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # 每周一 03:20 UTC（避开整点高峰）
    - cron: "20 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # CodeQL 上传 SARIF 需要 security-events: write
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # 只扫仓库自身代码，排除 vendor 产物
          queries: security-extended

      # rust 用 build-mode: none 走提取器直接解析源码，无需 autobuild

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
