name: Tmp debug install layout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          CLAUDE_CODE_SKIP_CHROME_MCP_SETUP: "1"
        run: bun install --frozen-lockfile

      - name: Locate streamdown and friends
        run: |
          set -x
          ls node_modules 2>/dev/null | grep -i streamdown || echo "root node_modules: no streamdown"
          ls node_modules/@streamdown 2>/dev/null || echo "root node_modules/@streamdown: missing"
          ls packages/remote-control-server/node_modules 2>/dev/null | head -40 || echo "rcs node_modules: missing"
          find . -maxdepth 6 -type d -name "streamdown" -not -path "./node_modules/.cache/*" 2>/dev/null
          find . -maxdepth 6 -type d -name "shiki" -not -path "./node_modules/.cache/*" 2>/dev/null
          find . -maxdepth 7 -type d -name "@streamdown" 2>/dev/null
          node -e "console.log(require('node:module').createRequire(process.cwd()+'/packages/remote-control-server/package.json').resolve('streamdown'))" || true
