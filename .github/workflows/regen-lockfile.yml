name: Regen lockfile

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to regenerate bun.lock on'
        required: true
        default: 'main'

jobs:
  regen:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25
        with:
          ref: ${{ inputs.ref }}

      - name: Install Bun 1.4.2 (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (regenerate lockfile)
        run: bun install

      - name: Sanitize artifact name
        run: echo "ARTIFACT_NAME=bun-lockfile-$(echo '${{ inputs.ref }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: bun.lock
