name: Regen lockfile

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to regenerate bun.lock on'
        required: true
        default: 'main'

jobs:
  regen:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25
        with:
          ref: ${{ inputs.ref }}

      # Bun 追 latest（性能）——lockfile 由当前 Bun 重算，格式兼容由 CI frozen-lockfile 把关
      - name: Install Bun (latest)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: latest

      - name: Install dependencies (regenerate lockfile)
        run: bun install

      - name: Sanitize artifact name
        env:
          REF: ${{ inputs.ref }}
        run: printf 'ARTIFACT_NAME=bun-lockfile-%s\n' "$(printf '%s' "$REF" | tr '/' '-' | tr -cd '[:alnum:]_.-')" >> "$GITHUB_ENV"

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: bun.lock
