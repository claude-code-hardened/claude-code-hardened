name: Build Native Modules

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/token-counter-napi/native/**'
      - 'packages/transcript-parser-napi/native/**'
      - '.github/workflows/build-native.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64（GNU，链接 glibc —— 运行时与本仓库现有 native 产物一致）
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Linux ARM64（aarch64 服务器 / ARM 容器）
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
          # macOS ARM64（Apple Silicon）
          - os: macos-14
            target: aarch64-apple-darwin
          # macOS x86_64
          - os: macos-13
            target: x86_64-apple-darwin
          # Windows x86_64（MSVC）
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64 linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build (token-counter)
        working-directory: packages/token-counter-napi/native
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (transcript-parser)
        if: hashFiles('packages/transcript-parser-napi/native/Cargo.toml') != ''
        working-directory: packages/transcript-parser-napi/native
        run: cargo build --release --target ${{ matrix.target }}

      # 统一整理产物到 vendor 布局：vendor/<name>/<triple>/<name>.node
      - name: Stage artifacts (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "stage/token-counter/${{ matrix.target }}" "stage/transcript-parser/${{ matrix.target }}"
          for name in token-counter transcript-parser; do
            crate="${name//-/_}_napi"
            if [ -f "packages/$name-napi/native/target/${{ matrix.target }}/release/lib$crate.so" ]; then
              cp "packages/$name-napi/native/target/${{ matrix.target }}/release/lib$crate.so" "stage/$name/${{ matrix.target }}/$name.node"
            elif [ -f "packages/$name-napi/native/target/${{ matrix.target }}/release/lib$crate.dylib" ]; then
              cp "packages/$name-napi/native/target/${{ matrix.target }}/release/lib$crate.dylib" "stage/$name/${{ matrix.target }}/$name.node"
            fi
          done
          find stage -type f

      - name: Stage artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/token-counter, stage/transcript-parser | Out-Null
          foreach ($name in @('token-counter', 'transcript-parser')) {
            $crate = $name -replace '-', '_'
            $src = "packages/$name-napi/native/target/${{ matrix.target }}/release/${crate}_napi.dll"
            if (Test-Path $src) { Copy-Item $src "stage/$name/${{ matrix.target }}/$name.node" }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: stage/
          if-no-files-found: error
