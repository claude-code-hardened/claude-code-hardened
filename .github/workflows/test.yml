name: Full Test

# 全量测试工作流：手动触发 + 每日定时。与 ci.yml 的 quality job 不同：
# 不做 flaky 容错过滤，测试结果原样上报（红即红），用于定期摸清整个项目的真实健康度。
on:
  workflow_dispatch:
  schedule:
    # 每日 UTC 18:00（北京时间次日 02:00）
    - cron: "0 18 * * *"

permissions:
  contents: read

env:
  CLAUDE_CODE_SKIP_CHROME_MCP_SETUP: "1"

jobs:
  # ── TS 全量测试：三平台矩阵 ──
  ts-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.defaultBranchName
          GIT_CONFIG_VALUE_1: "false"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        if: runner.os == 'Linux'
        run: bun run typecheck

      - name: Run all tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          bun test 2>&1 | tee test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Summarize failures
        if: failure()
        shell: bash
        run: |
          {
            echo "## 测试失败 — ${{ matrix.os }}"
            echo '```'
            grep -E '^\(fail\)|^error:|^# Unhandled' test-output.txt | head -50 || true
            echo '```'
            grep -cE '^\(fail\)' test-output.txt || echo 0
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt
          retention-days: 7

  # ── 包级测试：逐个 workspace 包跑自己的 test script ──
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test each package
        shell: bash
        run: |
          status=0
          for pkg_dir in packages/*/; do
            [ -f "$pkg_dir/package.json" ] || continue
            if grep -qE '"test"\s*:' "$pkg_dir/package.json"; then
              echo "::group::测试 $pkg_dir"
              (cd "$pkg_dir" && bun run test) || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

  # ── 构建冒烟：能构建、产物能跑 ──
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Smoke test (dist/cli.js)
        run: |
          node dist/cli.js --version
          echo "say hi" | node dist/cli.js -p --max-turns 1 2>&1 | head -20 || true

  # ── 汇总 ──
  summary:
    needs: [ts-tests, packages, build-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "# 全量测试汇总"
            echo "| Job | 结果 |"
            echo "|-----|------|"
            echo "| ts-tests | ${{ needs.ts-tests.result }} |"
            echo "| packages | ${{ needs.packages.result }} |"
            echo "| build-smoke | ${{ needs.build-smoke.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
